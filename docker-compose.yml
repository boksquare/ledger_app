services:
  bills-app:
    image: ghcr.io/boksquare/ledger_app:latest
    container_name: bills-app
    ports:
      - "8321:8000"
    volumes:
      - bills_data:/data
    environment:
      # Statement parsing (optional feature). LEDGER_AI_PROVIDER picks which of these
      # is active: claude_code (default), nvidia_nim, gemini, or openai_compatible.
      # See README's Configuration section for what each provider needs.
      - LEDGER_AI_PROVIDER=${LEDGER_AI_PROVIDER:-claude_code}
      - LEDGER_AI_MODEL=${LEDGER_AI_MODEL:-}
      - LEDGER_AI_EFFORT=${LEDGER_AI_EFFORT:-}
      # How long to wait on nvidia_nim/gemini/openai_compatible before falling back to the
      # built-in parser (default 180s). Free-tier hosted endpoints can have tens of seconds
      # of queuing/cold-start latency before generation even starts — raise this if you're
      # seeing "AI provider took too long to respond" on a provider that does eventually work.
      - LEDGER_AI_HTTP_TIMEOUT=${LEDGER_AI_HTTP_TIMEOUT:-}
      # claude_code — subscription-based, no API key. On any machine with Claude Code,
      # run `claude setup-token` and put CLAUDE_CODE_OAUTH_TOKEN=... in .env.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # nvidia_nim
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-}
      # gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # openai_compatible — OpenAI itself, or any provider/local server with the same API shape
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
    restart: unless-stopped

volumes:
  bills_data:
